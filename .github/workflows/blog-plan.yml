name: Blog planner (9pm Adelaide)

on:
  # Started at 9pm Adelaide by the app's Vercel cron (/api/cron/blog-plan). GitHub's own
  # schedule is not used: it ran hours late.
  workflow_dispatch:
    inputs:
      weekly:
        description: "Also run weekly research: competitors, community, ChatGPT visibility (normally Sundays only)"
        type: boolean
        default: false

concurrency:
  group: blog-plan
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ vars.BLOG_AGENT_GIT_REF || 'main' }}
          fetch-depth: 0
      # Knowledge base and pricing facts come from the upcoming release; falls back to this checkout.
      - name: Check out upcoming release for product context
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: ${{ vars.BLOG_AGENT_CONTEXT_REF || 'feature/social-kit' }}
          path: .blog-context
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Recommend tomorrow's ideas
        run: npx -y tsx scripts/blog-agent/plan.ts ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }} ${{ inputs.weekly && '--weekly' || '' }}
        env:
          BLOG_AGENT_BASE_URL: ${{ vars.BLOG_AGENT_BASE_URL }}
          BLOG_AGENT_TOKEN: ${{ secrets.BLOG_AGENT_TOKEN }}
          BLOG_AGENT_PREVIEW_REF: origin/${{ vars.BLOG_AGENT_CONTEXT_REF || 'feature/social-kit' }}
          BLOG_AGENT_CONTEXT_DIR: .blog-context
          BLOG_AGENT_CONTEXT_REF: ${{ vars.BLOG_AGENT_CONTEXT_REF || 'feature/social-kit' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          DATAFORSEO_RELAY_URL: ${{ secrets.DATAFORSEO_RELAY_URL }}
          DATAFORSEO_RELAY_SECRET: ${{ secrets.DATAFORSEO_RELAY_SECRET }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL || 'sc-domain:vendl.app' }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
